<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Page Not Found | Siddharth Verma</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%23191714'/%3E%3Ctext%20x='32'%20y='43'%20font-family='Georgia,serif'%20font-size='30'%20fill='%23f7f4ef'%20text-anchor='middle'%3ESV%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #f7f4ef; color: #191714;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  ::selection { background: #e8c25a; color: #191714; }

  .wrap { max-width: 520px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8175; margin: 0 0 22px;
  }
  .code {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400; font-size: 132px; line-height: 0.9;
    letter-spacing: -0.03em; margin: 0 0 14px;
  }
  h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400; font-size: 40px; line-height: 1.1;
    letter-spacing: -0.015em; margin: 0 0 16px;
  }
  h1 em { font-style: italic; color: #7a3020; }
  p {
    font-size: 17px; line-height: 1.62; color: #4a443b;
    margin: 0 0 34px; text-wrap: pretty;
  }
  .btn-home {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px; border: 1px solid #191714; border-radius: 999px;
    color: #191714; font-size: 14px; text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }
  .btn-home:hover { background: #191714; color: #f7f4ef; }

  @media (max-width: 640px) {
    .code { font-size: 96px; }
    h1 { font-size: 32px; }
    p { font-size: 16px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Error 404 — Page not found</p>
    <div class="code">404</div>
    <h1>This page <em>moved on</em>.</h1>
    <p>The link you followed doesn't lead anywhere — it may have been renamed or removed. Everything else is still where you left it.</p>
    <a class="btn-home" href="/">← Back to home</a>
  </main>
</body>
</html>
